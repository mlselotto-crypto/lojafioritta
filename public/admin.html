<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fioritta | Editor local</title><style>body{font:16px system-ui;background:#faf3e9;color:#49343a;margin:0}main{max-width:850px;margin:auto;padding:24px}h1,h2{font-family:Georgia;color:#610027}article{background:white;padding:16px;margin:12px 0;border:1px solid #e8d9d2;border-radius:8px}label{display:block;margin:10px 0}input{font:inherit;padding:8px;max-width:100%;box-sizing:border-box}input:not([type=checkbox]){width:100%}button,a.btn{display:inline-block;background:#610027;color:white;padding:12px;border:0;border-radius:5px;text-decoration:none;font:inherit;cursor:pointer;margin:6px 0}.note{background:#f2cdd0;padding:15px}</style><main><a href="index.html">← Catálogo</a><h1>Fioritta · Editor comercial</h1><p class="note">Ferramenta local de demonstração, não é um painel administrativo autenticado. Não contém dados de clientes nem segredos. Alterações só entram no catálogo após exportar e substituir catalog-data.js e republicar.</p><div id="rows"></div><button id="export">Exportar configurações JS</button> <button id="reset">Restaurar dados originais</button><p id="status" role="status"></p></main><script src="catalog-data.js"></script><script>const original=JSON.stringify(window.CATALOG);let d=JSON.parse(original);const root=document.getElementById('rows');function el(tag,text){const e=document.createElement(tag);if(text)e.textContent=text;return e}function draw(){root.replaceChildren();d.products.forEach(p=>{const a=el('article');a.append(el('h2',p.name+' · '+p.id));for(const [key,title,type] of [['name','Nome','text'],['price','Preço em reais (vazio = sob consulta)','number'],['lead','Prazo','text'],['hidden','Ocultar produto','checkbox']]){const l=el('label',title),i=el('input');i.type=type;if(type==='checkbox')i.checked=!!p[key];else i.value=p[key]??'';if(type==='number'){i.min=0;i.step='.01'}i.oninput=()=>{p[key]=type==='checkbox'?i.checked:type==='number'?(i.value===''?null:Number(i.value)):i.value};l.append(i);a.append(l)}root.append(a)})}document.getElementById('export').onclick=()=>{if(d.products.some(p=>!p.name.trim()||!p.lead.trim()||(p.price!==null&&(!Number.isFinite(p.price)||p.price<0)))){document.getElementById('status').textContent='Verifique nomes, prazos e preços.';return}const url=URL.createObjectURL(new Blob(['window.CATALOG = '+JSON.stringify(d,null,2)+';'],{type:'text/javascript'})),a=el('a');a.href=url;a.download='catalog-data.js';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);document.getElementById('status').textContent='Arquivo exportado. Substitua o arquivo na pasta public e publique novamente.'};document.getElementById('reset').onclick=()=>{d=JSON.parse(original);draw()};draw()</script></html>
